<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#191F27"/><stop offset="100%" stop-color="#101318"/></linearGradient></defs>
<rect x="1" y="1" width="998" height="348" rx="18" fill="url(#g)" stroke="#303740" stroke-width="2"/>
<rect x="1" y="1" width="7" height="348" rx="3" fill="#FF7A1A"/>
<text x="42" y="58" fill="#FF7A1A" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="3">INDUSTRIX  /  OVERVIEW</text>
<text x="42" y="101" fill="#F2F2F2" font-family="Arial, sans-serif" font-size="29" font-weight="700">Перспективы развития</text>
<text x="46" y="140" fill="#F2F2F2" font-family="Arial, sans-serif" font-size="20" font-weight="700">Долгосрочная цель — полноценная платформа цифровых двойников промышленных предприятий.</text>
<text x="46" y="178" fill="#A0A7B1" font-family="Arial, sans-serif" font-size="18" font-weight="400">Пользователи смогут создавать виртуальные производственные среды, проверять инженерные</text>
<text x="46" y="207" fill="#A0A7B1" font-family="Arial, sans-serif" font-size="18" font-weight="400">решения, анализировать работу оборудования и оценивать последствия изменений до внедрения на</text>
<text x="46" y="236" fill="#A0A7B1" font-family="Arial, sans-serif" font-size="18" font-weight="400">реальном предприятии.</text>
<text x="46" y="270" fill="#FF9B45" font-family="Arial, sans-serif" font-size="19" font-weight="700">Не просто мониторинг. Не просто аналитика. Новый подход к пониманию промышленного</text>
<text x="46" y="301" fill="#FF9B45" font-family="Arial, sans-serif" font-size="19" font-weight="700">производства.</text>
</svg>