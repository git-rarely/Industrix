<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#191F27"/><stop offset="100%" stop-color="#101318"/></linearGradient></defs>
<rect x="1" y="1" width="998" height="298" rx="18" fill="url(#g)" stroke="#303740" stroke-width="2"/>
<rect x="1" y="1" width="7" height="298" rx="3" fill="#FF7A1A"/>
<text x="42" y="58" fill="#FF7A1A" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="3">INDUSTRIX  /  OVERVIEW</text>
<text x="42" y="101" fill="#F2F2F2" font-family="Arial, sans-serif" font-size="29" font-weight="700">О проекте</text>
<text x="42" y="140" fill="#FF9B45" font-family="Arial, sans-serif" font-size="17">ЦИФРОВАЯ МОДЕЛЬ ПРОИЗВОДСТВА</text>
<text x="46" y="175" fill="#F2F2F2" font-family="Arial, sans-serif" font-size="20" font-weight="700">Industrix — интеллектуальная платформа цифрового моделирования промышленных предприятий.</text>
<text x="46" y="213" fill="#A0A7B1" font-family="Arial, sans-serif" font-size="18" font-weight="400">Платформа позволит создавать виртуальные модели производств, наблюдать за технологическими</text>
<text x="46" y="242" fill="#A0A7B1" font-family="Arial, sans-serif" font-size="18" font-weight="400">процессами, контролировать оборудование и анализировать показатели.</text>
<text x="46" y="276" fill="#A0A7B1" font-family="Arial, sans-serif" font-size="18" font-weight="400">Цель — проверять производственные сценарии и оценивать последствия решений без вмешательства в</text>
<text x="46" y="305" fill="#A0A7B1" font-family="Arial, sans-serif" font-size="18" font-weight="400">работу реального предприятия.</text>
</svg>